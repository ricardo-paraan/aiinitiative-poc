<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - Ticketing System</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tickets.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="page-header">
            <div class="header-content">
                <div>
                    <h1>My Tickets</h1>
                    <p class="subtitle">Track and manage your submitted tickets</p>
                </div>
                <button class="btn-primary" onclick="window.location.href='create-ticket.html'">
                    <span class="btn-icon">+</span>
                    Create New Ticket
                </button>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card stat-pending">
                <div class="stat-content">
                    <div class="stat-label">Pending</div>
                    <div class="stat-value" id="pendingCount">0</div>
                </div>
                <div class="stat-icon pending-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
            </div>

            <div class="stat-card stat-progress">
                <div class="stat-content">
                    <div class="stat-label">In Progress</div>
                    <div class="stat-value" id="progressCount">0</div>
                </div>
                <div class="stat-icon progress-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
            </div>

            <div class="stat-card stat-resolved">
                <div class="stat-content">
                    <div class="stat-label">Resolved</div>
                    <div class="stat-value" id="resolvedCount">0</div>
                </div>
                <div class="stat-icon resolved-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="9 12 11 14 15 10"></polyline>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="filters-section">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search by Ticket ID or Title..." />
            </div>

            <div class="filter-dropdowns">
                <select id="statusFilter" class="filter-select">
                    <option value="">All Status</option>
                </select>

                <select id="systemFilter" class="filter-select">
                    <option value="">All Systems</option>
                </select>

                <select id="categoryFilter" class="filter-select">
                    <option value="">All Categories</option>
                </select>

                <select id="sortFilter" class="filter-select">
                    <option value="newest">Date (Newest First)</option>
                    <option value="oldest">Date (Oldest First)</option>
                    <option value="updated">Last Updated</option>
                </select>
            </div>
        </div>

        <!-- Tickets Table -->
        <div class="table-container">
            <table class="tickets-table">
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>System</th>
                        <th>Category</th>
                        <th>Date Submitted</th>
                        <th>Last Updated</th>
                    </tr>
                </thead>
                <tbody id="ticketsTableBody">
                    <!-- Tickets will be loaded here -->
                    <tr>
                        <td colspan="7" class="loading-cell">
                            <div class="loading-spinner"></div>
                            <p>Loading tickets...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-container">
            <div class="pagination-info">
                <span id="paginationInfo">Showing 0 to 0 of 0 tickets</span>
            </div>
            <div class="pagination-controls">
                <button class="pagination-btn" id="prevBtn" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Previous
                </button>
                <div class="pagination-numbers" id="paginationNumbers">
                    <!-- Page numbers will be inserted here -->
                </div>
                <button class="pagination-btn" id="nextBtn" disabled>
                    Next
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tickets.js"></script>
</body>
</html>
