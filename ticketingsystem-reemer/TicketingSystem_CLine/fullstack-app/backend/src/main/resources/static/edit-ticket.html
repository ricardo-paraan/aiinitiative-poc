<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ticket - Ticket Management System</title>
    <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <div>
                    <h1>✏️ Edit Ticket</h1>
                    <p>Update ticket information</p>
                </div>
                <div>
                    <a href="index.html" class="btn-back">
                        ← Back to Dashboard
                    </a>
                </div>
            </div>
        </header>

        <!-- Success/Error Messages -->
        <div id="successBanner" class="success-banner">
            ✓ <span id="successMessage"></span>
        </div>
        
        <div id="errorBanner" class="error-banner">
            ⚠️ <span id="errorMessage"></span>
        </div>

        <!-- Edit Ticket Form -->
        <div class="form-container">
            <form id="createTicketForm" class="ticket-form">
                <div class="form-section">
                    <h2>Ticket Information</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title" class="required">Title</label>
                            <input type="text" id="title" name="title" required 
                                   placeholder="Brief description of the issue"
                                   maxlength="100">
                            <small>Maximum 100 characters</small>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="author" class="required">Author</label>
                            <input type="text" id="author" name="author" required 
                                   placeholder="Your name"
                                   maxlength="50">
                        </div>

                        <div class="form-group">
                            <label for="status" class="required">Status</label>
                            <select id="status" name="status" required>
                                <option value="">Select Status</option>
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="statusComment">Status Comment</label>
                            <input type="text" id="statusComment" name="statusComment" 
                                   placeholder="Optional comment about the status (e.g., 'Waiting for customer response')"
                                   maxlength="255">
                            <small>Optional - Maximum 255 characters</small>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="systemName" class="required">System Name</label>
                            <select id="systemName" name="systemName" required>
                                <option value="">Select System</option>
                                <option value="CRM">CRM - Customer Relationship Management</option>
                                <option value="ERP">ERP - Enterprise Resource Planning</option>
                                <option value="HRM">HRM - Human Resource Management</option>
                                <option value="Inventory">Inventory Management System</option>
                                <option value="Finance">Finance & Accounting System</option>
                                <option value="IT Support">IT Support System</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="category" class="required">Category</label>
                            <select id="category" name="category" required>
                                <option value="">Select Category</option>
                                <option value="Bug">Bug / Error</option>
                                <option value="Feature Request">Feature Request</option>
                                <option value="Enhancement">Enhancement</option>
                                <option value="Support">Technical Support</option>
                                <option value="Question">Question / Inquiry</option>
                                <option value="Documentation">Documentation</option>
                                <option value="Performance">Performance Issue</option>
                                <option value="Security">Security Concern</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="6"
                                      placeholder="Detailed description of the issue or request"
                                      maxlength="1000"></textarea>
                            <small>Maximum 1000 characters</small>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">
                        Cancel
                    </button>
                    <button type="submit" class="btn-primary">
                        Update Ticket
                    </button>
                </div>
            </form>
        </div>

        <!-- Status History Section -->
        <div class="status-history-section">
            <h2>📊 Status History</h2>
            <div id="statusHistoryList" class="status-history-list">
                <!-- Status history will be loaded here -->
            </div>
        </div>

        <!-- Comments Section -->
        <div class="comments-section">
            <h2>💬 Comments</h2>
            <div id="commentsList" class="comments-list">
                <!-- Comments will be loaded here -->
            </div>
            
            <div class="add-comment-form">
                <h3>Add a Comment</h3>
                <form id="addCommentForm">
                    <div class="form-group">
                        <label for="commentText">Your Comment:</label>
                        <textarea id="commentText" name="commentText" rows="4" 
                                  placeholder="Enter your comment here..." 
                                  required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="commentAuthor">Your Name:</label>
                        <input type="text" id="commentAuthor" name="commentAuthor" 
                               placeholder="Enter your name" 
                               required>
                    </div>
                    <button type="submit" class="btn-primary">Post Comment</button>
                </form>
            </div>
        </div>
    </div>

    <script src="edit-ticket.js?v=5"></script>
</body>
</html>
